<header class="site-header">
  <nav class="navbar navbar-expand-lg" aria-label="Основна навігація">
    <div class="container">
      <a class="navbar-brand wordmark" href="#hero" aria-label="SoftCode, на початок сторінки">
        SoftCode
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavigation"
        aria-controls="mainNavigation"
        aria-expanded="false"
        aria-label="Відкрити меню"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse header-nav" id="mainNavigation">
        <div class="nav-links" aria-label="Розділи сторінки">
          @for (link of navigationLinks; track link.href) {
            <a class="nav-link" [href]="link.href">{{ link.label }}</a>
          }
        </div>

        <a class="btn btn-primary header-cta" href="#contact">Обговорити проєкт</a>
      </div>
    </div>
  </nav>
</header>
